<!-- add.html -->
{% extends "base.html" %}
{% block title %}Add Student{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-person-plus"></i> Add New Student</h2>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow">
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" value="{{student.name}}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" value="{{student.email}}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" value="{{student.phone}}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Course</label>
            <select name="course" class="form-select" required>
              <option value="">Choose...</option>
              <option>Web Development</option>
              <option>Data Science</option>
              <option>UI/UX Design</option>
              <option>Mobile Dev</option>
              <option>DevOps</option>
            </select>
          </div>
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a href="{{ url_for('index') }}" class="btn btn-secondary me-md-2">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
