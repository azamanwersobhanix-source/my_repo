<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="../static/css/account.css">
    <title>Forgot Password</title>
</head>
<body>
    
    <!--****************************************-->

    <h1>Recovery</h1>
    <section class="acc">
        <div class="ac-box" style="height: auto;width: 100%;">
            <span style="color: grey;font-size: 14px;">Enter your email to receive your forgotten password</span>
            <form action="/submit" method="post">
            <div class="email"><i class="material-icons" style="font-size: 27px;display: inline;color: white;background:#ff6e5b;padding: 2px;">email</i><span class="input"><input type="email" placeholder="write your email..." style="background:rgba(255,255,255,0);"></span></div>
            <button type="submit">Recover</button>
            </form>       
        </div>
    </section>

    <!--****************************************-->
</body>
</html>
